# Postgres for Rectifi. Start it with:  docker compose up -d   (or: python scripts/dev.py db)
services:
  db:
    image: pgvector/pgvector:pg16        # normal Postgres 16 plus the vector extension we will want later
    container_name: rectifi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rectifi
      POSTGRES_PASSWORD: rectifi_dev     # dev password; the port below is only open to this laptop
      POSTGRES_DB: rectifi
    ports:
      - "127.0.0.1:5432:5432"            # 127.0.0.1 = reachable from this laptop only, not from your Wi-Fi
    volumes:
      - rectifi_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # makes rectifi_test and rectifi_demo on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rectifi -d rectifi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rectifi_pgdata:

# Rectifi on a small always-on server (Oracle Cloud Always Free, Arm). Read docs/HOSTING.md first.
#
#   cp .env.deploy.example .env.deploy        # then fill it in; `python scripts/dev.py deploy-check` checks it
#   docker compose --env-file .env.deploy -f deploy/compose.oracle.yml up -d --build
#
# Nothing here listens on the internet. The app port (8501) and the optional gateway port (8765) are published on 127.0.0.1
# only; Tailscale (installed on the server itself) forwards to them: Serve for you alone, Funnel for friends. The database and
# the model server have no published ports at all.
name: rectifi

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  db:
    # Two logins. `postgres` is the superuser: set-up and backups only (POSTGRES_PASSWORD). `rectifi` is the app's login, made on
    # the first start by deploy/db-init/10-app-role.sh as a plain role (RECTIFI_DB_PASSWORD): no superuser, no BYPASSRLS.
    # Postgres skips row level security, the privacy check between people, for a superuser, so the app must not be one.
    # The init script runs only when the volume is new. A volume made by an older version keeps its old superuser login:
    # the app refuses to start in multi-user or public mode until you recreate it (docs/HOSTING.md).
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.deploy}
      POSTGRES_DB: rectifi
      RECTIFI_DB_PASSWORD: ${RECTIFI_DB_PASSWORD:?set RECTIFI_DB_PASSWORD in .env.deploy}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d rectifi"]      # -h 127.0.0.1: the start-up server has no TCP port, so this waits for the init script
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.12.11}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"            # keep the model in memory: no slow reload, and the VM does not look idle
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - ollama:/root/.ollama
    mem_limit: 8g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
    logging: *logging

  ollama-pull:
    # One-shot: downloads the models into the ollama volume, then stops. Safe to run again (it skips what it has).
    image: ollama/ollama:${OLLAMA_VERSION:-0.12.11}
    restart: "no"
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull qwen2.5:3b && ollama pull qwen2.5-coder:3b && ollama pull nomic-embed-text
    depends_on:
      ollama:
        condition: service_healthy
    logging: *logging

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env.deploy
    environment:
      DATABASE_URL: postgresql://rectifi:${RECTIFI_DB_PASSWORD}@db:5432/rectifi
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${RECTIFI_MODEL_CHAT:-qwen2.5:3b}
      RECTIFI_MODEL_CHAT: ${RECTIFI_MODEL_CHAT:-qwen2.5:3b}
      RECTIFI_MODEL_CLASSIFY: ${RECTIFI_MODEL_CLASSIFY:-qwen2.5:3b}
      RECTIFI_MODEL_CODE: ${RECTIFI_MODEL_CODE:-qwen2.5-coder:3b}
      RECTIFI_MODEL_GRADE: ${RECTIFI_MODEL_GRADE:-qwen2.5:3b}
      RECTIFI_EMBED_MODEL: ${RECTIFI_EMBED_MODEL:-nomic-embed-text}
      # The Host header must be on this list. 127.0.0.1 is for the container's own health check.
      RECTIFI_ALLOWED_HOSTS: ${RECTIFI_HOSTNAME:?set RECTIFI_HOSTNAME in .env.deploy},localhost,127.0.0.1
      RECTIFI_ALLOWED_ORIGINS: https://${RECTIFI_HOSTNAME}
      RECTIFI_HOME: /tmp/rectifi
      TMPDIR: /tmp
    ports:
      - "127.0.0.1:8501:8501"
    # The root file system is read-only. The chart sandbox, the font cache and uploads' temp files all live in /tmp (a tmpfs:
    # it is wiped on restart, which only costs one slow first chart). RECTIFI_HOME points the font cache there too.
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  gateway:
    # The phone SMS gateway (plan D6). It is OFF unless you ask for it: `--profile gateway` (docs/HOSTING.md, the `rc` alias has it).
    # Same image as the app, same lock-down. It listens on 0.0.0.0 INSIDE its container only, because Docker's published port cannot
    # reach a loopback address there; the host side is 127.0.0.1 only, and Tailscale Funnel (port 8443) is the way in from outside.
    # Answers only /health and POST /sms with a device token. No model ever sees an SMS (CLAUDE.md rule 8).
    profiles: ["gateway"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env.deploy
    command: ["python", "-m", "rectifi.sms_gateway"]
    environment:
      DATABASE_URL: postgresql://rectifi:${RECTIFI_DB_PASSWORD}@db:5432/rectifi
      RECTIFI_SMS_HOST: 0.0.0.0
      RECTIFI_SMS_PORT: "8765"
      RECTIFI_HOME: /tmp/rectifi
      TMPDIR: /tmp
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8765/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  backup:
    # A copy of the database every day, kept for 7 days, in ${BACKUP_DIR} on the server. Restore steps: docs/HOSTING.md.
    # It logs in as `postgres`: pg_dump as the plain app role would fail on the tables that row level security forces.
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${BACKUP_DIR:-/var/backups/rectifi}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/rectifi-$$(date +%F).dump
          if pg_dump -h db -U postgres -Fc rectifi > "$$f.tmp"; then mv "$$f.tmp" "$$f"; else rm -f "$$f.tmp"; echo "backup failed"; fi
          ls -1t /backups/rectifi-*.dump 2>/dev/null | tail -n +8 | xargs -r rm -f
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  ollama:
